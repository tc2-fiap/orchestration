apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: {{ .Values.global.namespace }}
data:
  # Runs once, on first container start, via the official postgres image's
  # docker-entrypoint-initdb.d hook. Passwords are never written here — the
  # script reads them from environment variables sourced from the
  # postgres-credentials Secret at container start (see deployment.yaml).
  init-schemas.sh: |
    #!/bin/bash
    set -euo pipefail

    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
    {{- range $key, $role := .Values.postgres.roles }}

    -- {{ $key }} service: own schema, own role, no access to any other schema
    CREATE SCHEMA IF NOT EXISTS {{ $role.schema }};
    CREATE ROLE {{ $key }}_role LOGIN PASSWORD '${{ $key | upper }}_DB_PASSWORD';
    ALTER ROLE {{ $key }}_role SET search_path TO {{ $role.schema }};
    GRANT USAGE, CREATE ON SCHEMA {{ $role.schema }} TO {{ $key }}_role;
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA {{ $role.schema }} TO {{ $key }}_role;
    ALTER DEFAULT PRIVILEGES IN SCHEMA {{ $role.schema }} GRANT ALL PRIVILEGES ON TABLES TO {{ $key }}_role;
    ALTER DEFAULT PRIVILEGES IN SCHEMA {{ $role.schema }} GRANT ALL PRIVILEGES ON SEQUENCES TO {{ $key }}_role;
    {{- end }}
    EOSQL
