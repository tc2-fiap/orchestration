apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fiap-games
  namespace: {{ .Values.global.namespace }}
  annotations:
    # orders-api's /api/orders/{id}/stream is a Server-Sent Events endpoint
    # (notes.md — polling→SSE decision). nginx buffers responses and
    # defaults to a 60s read/send timeout by default, both of which would
    # break a long-lived SSE connection; there's one Ingress resource here
    # so these apply system-wide, which is harmless for every other route.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # See instructions.md §9.1 for the full routing table. The
          # payments-api webhook route is real-gateway scope, still
          # unbuilt (notes.md 4).
          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: users-api
                port:
                  number: 8080
          - path: /api/catalog
            pathType: Prefix
            backend:
              service:
                name: catalog-api
                port:
                  number: 8080
          - path: /api/quotations
            pathType: Prefix
            backend:
              service:
                name: catalog-api
                port:
                  number: 8080
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: orders-api
                port:
                  number: 8080
          - path: /api/library
            pathType: Prefix
            backend:
              service:
                name: orders-api
                port:
                  number: 8080
          - path: /api/payments
            pathType: Prefix
            backend:
              service:
                name: payments-api
                port:
                  number: 8080
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notifications-api
                port:
                  number: 8080
          - path: /api/platform
            pathType: Prefix
            backend:
              service:
                name: platform-api
                port:
                  number: 8080
          # Catch-all, must stay last: nginx-ingress matches by longest
          # prefix regardless of declaration order, but this is the
          # fallback for anything not covered by an /api/* route above.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8080
